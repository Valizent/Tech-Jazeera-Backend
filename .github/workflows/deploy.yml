name: Deploy to Oracle Server

on:
  push:
    branches:
      - main

jobs:
  # Fixed 2026-10-06, a real QA-audit finding (D01): this workflow went
  # straight from push to `git pull` + `pm2 restart` on the real production
  # VM with nothing checking the code first — exactly the gap that let a
  # commit with a broken import (SyntaxError at module load, the whole API
  # crash-looping) reach production undetected. A real test/lint job now has
  # to pass before `deploy` is even allowed to start (`needs: test`).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
        # A clean runner has no server/.env, and env.js exits at import when a
        # required value is missing. These only satisfy that startup check: the
        # suite never connects to MONGODB_URI (test/setup.js starts its own
        # in-memory MongoDB) and never reaches Cloudinary.
        env:
          NODE_ENV: development
          PORT: '5000'
          MONGODB_URI: mongodb://unused-in-tests/placeholder
          JWT_ACCESS_SECRET: ci-only-placeholder-secret-not-used-in-prod-00000000
          JWT_REFRESH_SECRET: ci-only-placeholder-secret-not-used-in-prod-00000001
          CLIENT_URL: http://localhost:5173
          UPLOAD_DIR: ./uploads
          CLOUDINARY_CLOUD_NAME: ci-placeholder
          CLOUDINARY_API_KEY: ci-placeholder
          CLOUDINARY_API_SECRET: ci-placeholder

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/Tech-Jazeera-Backend
            git pull origin main
            npm install
            pm2 restart aljazeera-backend
            pm2 save
